server:
  port: 8090

spring:
  application:
    name: stationery-member-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:stationery_member}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2s
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  profiles:
    active: local

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.gechuang.stationery.*.entity
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health

stationery:
  notification:
    enabled: true
    # log: only write rendered messages to backend logs.
    # wechat-official-account: send WeChat official account template messages.
    # tencent-cloud-sms: send Tencent Cloud SMS template messages.
    # aliyun-sms: send Alibaba Cloud SMS template messages.
    channel: ${MEMBER_NOTIFICATION_CHANNEL:log}
    wechat:
      app-id: ${WECHAT_MP_APP_ID:}
      app-secret: ${WECHAT_MP_APP_SECRET:}
      member-created-template-id: ${WECHAT_MP_MEMBER_CREATED_TEMPLATE_ID:}
      recharge-template-id: ${WECHAT_MP_RECHARGE_TEMPLATE_ID:}
      consumption-template-id: ${WECHAT_MP_CONSUMPTION_TEMPLATE_ID:}
      openid-by-mobile: {}
    tencent-sms:
      endpoint: ${TENCENT_SMS_ENDPOINT:https://sms.tencentcloudapi.com/}
      region: ${TENCENT_SMS_REGION:ap-guangzhou}
      secret-id: ${TENCENT_SMS_SECRET_ID:}
      secret-key: ${TENCENT_SMS_SECRET_KEY:}
      sms-sdk-app-id: ${TENCENT_SMS_SDK_APP_ID:}
      sign-name: ${TENCENT_SMS_SIGN_NAME:}
      member-created-template-id: ${TENCENT_SMS_MEMBER_CREATED_TEMPLATE_ID:}
      recharge-template-id: ${TENCENT_SMS_RECHARGE_TEMPLATE_ID:}
      consumption-template-id: ${TENCENT_SMS_CONSUMPTION_TEMPLATE_ID:}
    aliyun-sms:
      endpoint: ${ALIYUN_SMS_ENDPOINT:dysmsapi.aliyuncs.com}
      sign-name: ${ALIYUN_SMS_SIGN_NAME:}
      member-created-template-code: ${ALIYUN_SMS_MEMBER_CREATED_TEMPLATE_CODE:}
      recharge-template-code: ${ALIYUN_SMS_RECHARGE_TEMPLATE_CODE:}
      consumption-template-code: ${ALIYUN_SMS_CONSUMPTION_TEMPLATE_CODE:}
      member-created-param-names: ${ALIYUN_SMS_MEMBER_CREATED_PARAM_NAMES:business_code,member_code}
      recharge-param-names: ${ALIYUN_SMS_RECHARGE_PARAM_NAMES:business_code,input,input_gift}
      consumption-param-names: ${ALIYUN_SMS_CONSUMPTION_PARAM_NAMES:business_code,output,left}
